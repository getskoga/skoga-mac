name: Skoga
options:
  bundleIdPrefix: dev.getskoga
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Skoga:
    type: application
    platform: macOS
    sources:
      - path: Skoga
        excludes:
          - "**/Info.plist"
    info:
      path: Skoga/App/Info.plist
      properties:
        CFBundleName: Skoga
        CFBundleDisplayName: Skoga
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIdentifier: dev.getskoga.Skoga
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: ""
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        # Drop any .otf/.ttf into Skoga/App/Fonts/ to auto-register (Geist, Newsreader)
        ATSApplicationFontsPath: Fonts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.getskoga.Skoga
        PRODUCT_NAME: Skoga
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Skoga/App/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Skoga/App/Skoga.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
